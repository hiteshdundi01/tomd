[project]
name = "tomd"
version = "0.2.0"
description = "Convert anything to Markdown — PDFs, web articles, blog posts, and more"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["pdf", "markdown", "converter", "ocr", "gemini", "ai", "scraper", "web", "article"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    # Web scraper dependencies
    "playwright>=1.49.0",
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/hiteshdundi01/tomd"
Repository = "https://github.com/hiteshdundi01/tomd"
Issues = "https://github.com/hiteshdundi01/tomd/issues"

[project.scripts]
tomd = "tomd.web.app:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

